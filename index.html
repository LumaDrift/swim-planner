    case "loadFav": { const f = S.favs.find(x => x.id === b.dataset.id); loadCfg(f.cfg); applyPoolToO(); S.planDate = todayStr(); S.planWhy = "收藏：" + f.name; S.planBack = S.view; toast(`已载入：${f.name}`); return go("plan"); }
    case "rename": S.renaming = b.dataset.id; break;
    case "renameOk": { const f = S.favs.find(x => x.id === b.dataset.id), v = (document.getElementById("rn").value || "").trim(); if (f && v) f.name = v; S.renaming = null; break; }
    case "delFav": if (S.confirm !== b.dataset.id) { S.confirm = b.dataset.id; break; } S.favs = S.favs.filter(f => f.id !== b.dataset.id); S.confirm = null; break;
    case "rpe": S.rpe = +dv; { const dd = document.getElementById("dDate"), dn = document.getElementById("dNote"); if (dd) S.dDate = dd.value; if (dn) S.dNote = dn.value; } break;
    case "past": S.pastId = b.dataset.id; S.confirm = null; return go("past");
    case "pastOpen": S.pastIdx = +b.dataset.i; return go("pastDetail");
    case "log": {
      S.dDate = document.getElementById("dDate").value; S.dNote = document.getElementById("dNote").value;
      if (S.rpe == null) { toast("先选一个分数：整体有多累"); break; }
      const p = compute(), date = S.dDate || todayStr(), pct = S.pct == null ? 100 : S.pct;
      const dist = Math.round(p.dist * pct / 100 / S.o.pool) * S.o.pool;
      S.pct = null; S.dDate = null; S.dNote = null;
      S.logs.push({ id: uid(), test: !!S.testMode, pct, date, dist, planned: p.dist, mins: Math.max(1, Math.round(p.mins * Math.max(pct, 30) / 100)), rpe: S.rpe, focus: S.o.focus, note: (document.getElementById("dNote").value || "").trim(), lines: planLines(p), cfg: JSON.parse(JSON.stringify(cfg())) });
      S.rpe = null; S.calMonth = date.slice(0, 7); S.selDay = date; S.planDate = null; S.seg.hist = "log";
      toast("记下来了，下次的推荐会参考这次"); return go("home");
    }
    case "mon": { const [y, m] = S.calMonth.split("-").map(Number), d = new Date(y, m - 1 + +b.dataset.d, 1); S.calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; break; }
    case "day": S.selDay = b.dataset.d; S.calMonth = b.dataset.d.slice(0, 7); S.seg.hist = "log"; S.confirm = null; if (S.view !== "hist") return go("hist"); break;
    case "again": { const l = S.logs.find(x => x.id === b.dataset.id); loadCfg(l.cfg); applyPoolToO(); S.planDate = todayStr(); S.planWhy = "再练一次"; S.planBack = "hist"; return go("plan"); }
    case "delLog": if (S.confirm !== b.dataset.id) { S.confirm = b.dataset.id; break; } S.logs = S.logs.filter(l => l.id !== b.dataset.id); S.confirm = null; toast("已删除"); if (S.view === "past") return go("hist"); break;
    case "testToggle": S.testMode = !S.testMode; if (!S.testMode) S.dayOffset = 0; toast(S.testMode ? "测试模式已打开，首页可以点“下一天”" : "已回到真实日期"); break;
    case "nextDay": S.dayOffset = (S.dayOffset || 0) + 1; S.planDate = null; S.selDay = null; { const d = nowDate(); S.calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; } toast(`现在是 ${nowDate().getMonth() + 1} 月 ${nowDate().getDate()} 日`); break;
    case "realDay": S.dayOffset = 0; S.testMode = false; S.planDate = null; S.selDay = null; toast("已回到真实日期"); break;
    case "clearTest": if (S.confirm !== "clearTest") { S.confirm = "clearTest"; break; } S.logs = S.logs.filter(l => !l.test); S.confirm = null; toast("测试记录已清除"); break;
    case "editQ": return startQuiz(b.dataset.q);
    case "prefEquip": { const l = P().equip; P().equip = l.includes(dv) ? l.filter(x => x !== dv) : [...l, dv]; break; }
    case "redoQuiz": return startQuiz(null);
    case "wipe":
      if (S.confirm !== "wipe") { S.confirm = "wipe"; break; }
      S.logs = []; S.favs = []; S.rows = []; S.profile = { ...DEFAULT_PROFILE, pace: {} }; S.confirm = null; toast("已清除"); return startQuiz(null);
    // 问卷
    case "qpick": S.qd[b.dataset.f] = dv; if (S.qEdit) break; return quizNext();
    case "qstroke": { const l = S.qd.strokes; S.qd.strokes = l.includes(dv) ? l.filter(x => x !== dv) : [...l, dv]; break; }
    case "qspeed": normPace(S.qd); if (dv) S.qd.pace[b.dataset.s] = +dv; else delete S.qd.pace[b.dataset.s]; break;
    case "qset": S.qd[b.dataset.f] = +dv; break;
    case "qnext": return quizNext();
    case "qskip": return quizNext();
    case "qback": S.qi = Math.max(0, S.qi - 1); break;
    case "qcancel": return go(S.qFrom || "me");
    case "qfinish": saveQuiz(); S.profile.onboarded = true; S.planDate = null; toast("档案已保存，之后的推荐会按这个来"); return go("me");
    case "copy": {
      const p = compute(), text = unitize(`泳池课表：共 ${p.dist} 码，约 ${p.mins} 分钟（${condText(S.o)}）\n` + planLines(p).join("\n"));
      const fb = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.fontSize = "16px"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("已复制"); } catch (err) { toast("复制没成功，可以长按文字手动复制"); } ta.remove(); };
      try { navigator.clipboard.writeText(text).then(() => toast("已复制，可以发给朋友"), fb); } catch (err) { fb(); }
      return;
    }
  }
  render();
});
function applyPoolToO() { const [len, u] = POOLS[P().pool]; if (S.o.pool !== len || S.o.unit !== u) { S.o.pool = len; S.o.unit = u; } }
document.getElementById("toast").addEventListener("click", e => {
  if (e.target.id === "undoBtn" && undoFn) { undoFn(); undoFn = null; document.getElementById("toast").hidden = true; render(); }
});
APP.addEventListener("input", e => {
  if (e.target.id !== "dPct") return;
  const el = e.target, pct = +el.value, plan = +el.dataset.plan, pool = +el.dataset.pool;
  S.pct = pct; el.style.setProperty("--v", pct + "%");
  const lab = document.getElementById("pctLab");
  if (lab) lab.textContent = unitize(`${pct}% · 约 ${(Math.round(plan * pct / 100 / pool) * pool).toLocaleString()} 码`);
});
// 禁止双指缩放（加到主屏幕当 App 用时页面固定）
["gesturestart", "gesturechange"].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));

load();
render();

</script>
</body>
</html>
