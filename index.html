<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="泳池课表">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>泳池课表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
<style>
/* Layout: one calm column; the home page opens on a water-ripple week check-in, everything else is quiet tinted cards; a floating liquid-glass tab bar */
:root {
  --bg: #ffffff; --ink: #0f1720; --muted: #8b95a1; --line: #e8edf2; --tint: #f4f7fb; --tint-2: #eef3f9;
  --blue: #2f7cf6; --blue-s: #e9f1fe; --purple: #8b6cf0; --coral: #f2705f; --red: #e5484d;
  --ph-warm: #9cc2fb; --ph-drill: #b9a6f6; --ph-cool: #9fdcbf;
  --glass: linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.52)); --glass-edge: rgba(255,255,255,.85);
  --glass-shadow: 0 14px 34px -12px rgba(15,23,32,.28), 0 2px 6px rgba(15,23,32,.06);
  --fade: rgba(255,255,255,.94);
  --font: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1116; --ink: #eef2f6; --muted: #8893a0; --line: #222a33; --tint: #161c23; --tint-2: #1b222a;
  --blue: #5b9bff; --blue-s: #172a45; --purple: #a48cff; --coral: #ff8a7a; --red: #ff6b6f;
  --ph-warm: #3d6fae; --ph-drill: #6b58b8; --ph-cool: #3f8a68;
  --glass: linear-gradient(180deg, rgba(40,48,58,.72), rgba(28,34,42,.6)); --glass-edge: rgba(255,255,255,.12);
  --glass-shadow: 0 14px 34px -12px rgba(0,0,0,.7); --fade: rgba(13,17,22,.94); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1116; --ink: #eef2f6; --muted: #8893a0; --line: #222a33; --tint: #161c23; --tint-2: #1b222a;
  --blue: #5b9bff; --blue-s: #172a45; --purple: #a48cff; --coral: #ff8a7a; --red: #ff6b6f;
  --ph-warm: #3d6fae; --ph-drill: #6b58b8; --ph-cool: #3f8a68;
  --glass: linear-gradient(180deg, rgba(40,48,58,.72), rgba(28,34,42,.6)); --glass-edge: rgba(255,255,255,.12);
  --glass-shadow: 0 14px 34px -12px rgba(0,0,0,.7); --fade: rgba(13,17,22,.94); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: pan-x pan-y; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; padding-inline: 20px; padding-block: 0 40px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.has-tabs { padding-bottom: 130px; }
body.has-bar { padding-bottom: 110px; }
#app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
h1, h2, p { margin: 0; }
.num { font-family: "Inter", var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.red { color: var(--red) !important; }
.center { text-align: center; align-self: center; }
.flexrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hint { margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.55; }

/* 页面标题 */
.date { margin-top: 26px; font-size: 13px; color: var(--muted); }
.hi { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.hd { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 26px; min-height: 76px; }
.hd h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; margin-inline: -20px; padding-inline: 20px; background: var(--bg); }
.nav b { font-size: 16px; }
.nav > span { justify-self: end; }
.back { color: var(--blue); font-weight: 500; display: inline-flex; align-items: center; min-height: 44px; }
.back::before { content: "‹"; font-size: 26px; line-height: 1; margin: -3px 4px 0 0; }
.txt { color: var(--blue); font-weight: 600; min-height: 40px; font-size: 14px; }
.txt.center { margin-top: 16px; color: var(--muted); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

/* 水波打卡 */
.rip { position: relative; margin: 34px auto 0; max-width: 100%; }
.rip i { position: absolute; border-radius: 50%; border: 1px solid #c9dcfb; display: block; }
.rip .core { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--bg) 0%, var(--blue-s) 60%, #dce9fd 100%); box-shadow: inset 0 0 0 1px #d3e3fb; }
.dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1.5px #d0def4; }
.dot.on { background: var(--blue); box-shadow: 0 0 0 4px var(--bg); }
.dot.now { box-shadow: inset 0 0 0 2.5px var(--blue), 0 0 0 4px var(--bg); }
.dl { position: absolute; width: 28px; text-align: center; font-size: 11px; color: #a7b0bb; }
.dl.now { color: var(--blue); font-weight: 700; }
.mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--muted); text-align: center; }
.mid strong { font-family: "Inter", var(--font); font-size: 60px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -.04em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rip i { border-color: #2a4466; } :root:not([data-theme="light"]) .rip .core { background: radial-gradient(circle at 50% 35%, #1c2a3d, #14233a 70%); box-shadow: inset 0 0 0 1px #2a4466; } :root:not([data-theme="light"]) .dot { box-shadow: inset 0 0 0 1.5px #33465e; } }

/* 按钮 */
.go { margin-top: 36px; min-height: 56px; border-radius: 999px; background: var(--blue); color: #ffffff; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -12px rgba(47,124,246,.7); }
.go:active, .btn:active { transform: scale(.98); }
.btn { min-height: 50px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 16px; white-space: nowrap; }
.btn.soft { background: var(--tint); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { margin-top: 24px; background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px var(--line); }
.two { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 数据方块与卡片 */
.tiles { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tl { border-radius: 22px; background: linear-gradient(180deg, var(--tint), var(--tint-2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(15,23,32,.035); padding: 14px 13px 12px; display: flex; flex-direction: column; min-width: 0; }
.tl small { font-size: 12px; color: var(--muted); }
.tl b { font-size: 23px; font-weight: 700; margin-top: 6px; line-height: 1.1; white-space: nowrap; }
.tl em { font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec { margin-top: 30px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec.first { margin-top: 18px; }
.sec b { font-size: 17px; font-weight: 700; }
.sec span, .sec button { font-size: 13px; color: var(--muted); }
.card { margin-top: 12px; border-radius: 22px; background: var(--tint); box-shadow: inset 0 0 0 1px rgba(15,23,32,.035); padding: 18px; display: block; width: 100%; }
.card.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 22px 18px; }
.card.list { padding: 4px 18px; }
.tip { display: flex; gap: 14px; align-items: flex-start; }
.tic { width: 46px; height: 46px; border-radius: 15px; background: var(--bg); color: var(--blue); display: grid; place-items: center; flex: none; }
.tip b { font-size: 16px; display: block; }
.tip p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bal { display: flex; flex-direction: column; gap: 12px; }
.bl { display: grid; grid-template-columns: 40px 1fr 24px; align-items: center; gap: 12px; font-size: 13px; }
.bl .tr { position: relative; height: 8px; border-radius: 4px; background: var(--line); overflow: visible; }
.bl .tr i { display: block; height: 100%; border-radius: 4px; }
.bl .tr u { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--muted); opacity: .5; border-radius: 1px; }
.bl b { text-align: right; }
.bl b.zero { color: var(--muted); font-weight: 500; }

/* 列表 */
.li { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li.col { flex-direction: column; align-items: flex-start; gap: 10px; }
.li .g { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.li .g b { font-size: 15px; font-weight: 600; }
.li .g small { font-size: 12px; color: var(--muted); }
.li.sel { color: var(--blue); }
.li.sel .g b::after { content: "  ✓"; }
.badge { width: 44px; height: 40px; border-radius: 13px; background: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.dotc { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chev { color: var(--muted); font-size: 20px; }
.tag { font-style: normal; font-size: 11px; color: var(--blue); border: 1px solid var(--blue); border-radius: 6px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }
.favs { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fav { border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fav b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav small { font-size: 12px; color: var(--muted); }
.fav .pbar { margin-top: 10px; }
.pbar { display: flex; gap: 3px; }
.pbar i { display: block; border-radius: 3px; }

/* 分段切换 */
.segs { margin-top: 6px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--tint); }
.segs button { min-height: 38px; border-radius: 10px; text-align: center; font-size: 14px; color: var(--muted); font-weight: 500; }
.segs button.on { background: var(--bg); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(15,23,32,.1); }
.plancard { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.plancard b { display: block; font-size: 19px; }
.plancard .big { font-size: 26px; font-weight: 700; }

/* 课表 */
.sum { margin-top: 10px; display: flex; gap: 22px; }
.sum b { font-size: 34px; font-weight: 700; }
.sum small { font-size: 13px; color: var(--muted); margin-left: 3px; }
.lane { padding: 0; overflow: hidden; }
.swipe { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.swipe .acts { position: absolute; top: 0; right: 0; bottom: 0; display: flex; opacity: 0; }
.swipe.open .acts, .swipe:has(.row.drag) .acts { opacity: 1; }
.swipe .acts button { width: 80px; color: #ffffff; font-weight: 700; font-size: 14px; text-align: center; }
.swipe .acts .r { background: var(--blue); }
.swipe .acts .d { background: var(--red); }
.row { position: relative; z-index: 1; width: 100%; display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 14px 16px 14px 14px; background: var(--tint); transition: transform .2s ease; touch-action: pan-y; }
.row.drag { transition: none; }
.swipe.open .row { transform: translateX(-160px); }
.row::after { content: ""; position: absolute; left: 29px; top: 0; bottom: 0; width: 2px; background: var(--line); z-index: -1; }
.lane > .swipe:first-child .row::after { top: 50%; }
.no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: "Inter", var(--font); font-weight: 700; font-size: 13px; background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 2px var(--c); }
.row.main .no { background: var(--blue); color: #ffffff; box-shadow: none; }
.row .g { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .g small { font-size: 12px; color: var(--muted); }
.row .g b { font-size: 16px; font-weight: 700; }
.row .g b em { font-style: normal; font-weight: 400; color: var(--muted); font-size: 13px; }
.row .g .pl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bq { font-size: 24px; font-weight: 700; white-space: nowrap; }
.row.main .bq { color: var(--blue); }
.add { position: relative; display: block; width: 100%; min-height: 54px; padding-left: 58px; text-align: left; color: var(--blue); font-weight: 700; }
.add::before { content: ""; position: absolute; left: 29px; top: 0; height: 18px; width: 2px; background: var(--line); }
.add::after { content: ""; position: absolute; left: 21px; top: 18px; width: 18px; height: 2px; border-radius: 1px; background: var(--line); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--fade); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line); }

/* 练法详情 */
.dhero { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.dhero small { font-size: 13px; color: var(--muted); }
.dhero h2 { font-size: 24px; font-weight: 800; }
.dq { font-size: 48px; font-weight: 700; line-height: 1.05; color: var(--blue); }
.dq small { font-size: 15px; margin-left: 4px; font-weight: 500; }
.info { display: flex; flex-direction: column; gap: 16px; }
.info p { font-size: 15px; margin-top: 4px; }
.lab { font-size: 13px; color: var(--blue); font-weight: 600; }
.steps { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.steps b { font-size: 17px; }
.steps small { display: block; font-size: 13px; color: var(--muted); }
.ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.stepper { margin-top: 12px; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; border-radius: 18px; background: var(--tint); overflow: hidden; }
.stepper button { min-height: 56px; font-size: 26px; font-weight: 600; color: var(--blue); text-align: center; }
.stepper button:disabled { color: var(--line); }
.stepper span { text-align: center; font-weight: 700; }
.chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.li .chips { margin-top: 0; }
.chip { min-height: 42px; padding: 0 16px; border-radius: 999px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; }
.chip.on { background: var(--blue-s); color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); font-weight: 700; }
.choose { margin-top: 12px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.choose button { min-height: 50px; border-radius: 16px; background: var(--tint); text-align: center; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.choose button.on { background: var(--blue-s); color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--blue); }
.input { margin-top: 12px; width: 100%; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 0; background: var(--tint); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font: inherit; font-size: 16px; }
textarea.input { padding: 14px 16px; min-height: 96px; resize: vertical; }
.li .input { margin-top: 0; }
.rpe { margin-top: 12px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
.rpe button { aspect-ratio: 1 / 1.25; max-width: 100%; border-radius: 10px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--line); text-align: center; font-family: "Inter", var(--font); font-weight: 600; font-size: 14px; }
.rpe button.on { background: var(--blue); color: #ffffff; box-shadow: none; }
.rpel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

/* 日历与图表 */
.mon { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.mon button { min-width: 44px; min-height: 40px; font-size: 22px; color: var(--blue); text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.day { aspect-ratio: 1; max-width: 42px; width: 100%; justify-self: center; border-radius: 50%; text-align: center; font-size: 14px; font-family: "Inter", var(--font); }
.day.has { background: var(--blue); color: #ffffff; font-weight: 700; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--blue); font-weight: 700; }
.day.has.today { color: #ffffff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--blue); }
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .tx { fill: var(--muted); font-size: 10px; font-family: "Inter", sans-serif; }
.chart .bar { fill: var(--ph-warm); }
.chart .cur { fill: var(--blue); }

/* 问卷 */
.qtop { display: flex; justify-content: space-between; align-items: center; min-height: 52px; margin-top: 10px; }
.qprog { height: 4px; border-radius: 2px; background: var(--tint); overflow: hidden; }
.qprog i { display: block; height: 100%; background: var(--blue); border-radius: 2px; transition: width .25s; }
.qbody { margin-top: 30px; display: flex; flex-direction: column; }
.qt { font-size: 28px; font-weight: 800; margin-top: 4px; line-height: 1.25; }
.qopts { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.qopt { display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border-radius: 20px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--line); }
.qopt b { font-size: 17px; }
.qopt small { font-size: 13px; color: var(--muted); }
.qopt.on { background: var(--blue-s); box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--blue); }
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qgrid .qopt { align-items: center; padding: 26px 10px; }
.qrow { display: flex; flex-direction: column; margin-bottom: 18px; }
.qrow .chips { margin-top: 8px; }

/* 悬浮液态玻璃标签栏 */
body.has-tabs::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 124px; pointer-events: none; z-index: 6; background: linear-gradient(180deg, transparent, var(--fade) 62%); }
.tabs { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); width: min(calc(100% - 36px), 480px); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); height: 66px; border-radius: 33px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 6px;
  background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.6); }
.tabs button { height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10.5px; color: var(--muted); font-weight: 500; }
.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs .on { color: var(--blue); font-weight: 700; background: linear-gradient(180deg, rgba(47,124,246,.17), rgba(47,124,246,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 1px rgba(47,124,246,.12); }
.tabs .on svg { fill: currentColor; }
.tabs .on svg .ln { stroke: var(--bg); fill: none; }

/* 提示条 */
[hidden] { display: none !important; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 40px); }
.toast button { color: var(--blue); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { .row, .qprog i { transition: none; } .go:active, .btn:active { transform: none; } }

/* ---- 3.0.1 调整 ---- */
/* 首页第一屏更紧凑，数据方块不被标签栏挡住 */
.date { margin-top: 18px; }
.rip { margin-top: 26px; }
.go { margin-top: 30px; }

.invite { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--blue-s); box-shadow: inset 0 0 0 1px rgba(47,124,246,.18); }

/* 课表：字放大，泳池边也看得清 */
.sum b { font-size: 40px; }
.sum small { font-size: 15px; }
.row { grid-template-columns: 36px 1fr auto; gap: 14px; padding: 18px 18px 18px 14px; }
.row::after { left: 31px; }
.add::before { left: 31px; } .add::after { left: 23px; }

.row .g b em { font-size: 15px; }

/* 练法详情也放大 */
.dhero h2 { font-size: 28px; }

/* 日历：选中的那一天 */
.day.sel { background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: none; }
.day.has.sel { background: var(--ink); color: var(--bg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--blue); }

.dayc .dt { font-size: 18px; }

.dayc .note { font-size: 15px; }
.dayc .ul { font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.dayc .two { margin-top: 0; }
.row .g b em { display: block; font-size: 14px; line-height: 1.3; }
.row .g > small:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bq { font-size: 30px; align-self: center; }
/* 3.0.2：按钮下面的方块边缘清楚，不再发糊 */
.go { box-shadow: none; }
.tiles { margin-top: 18px; }
.tl { background: var(--tint); box-shadow: none; }
.li.wk { min-height: 56px; }
.badge.rest { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
/* 测试模式 */
.testbar { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; background: #fff4e5; color: #8a5300; font-size: 13px; font-weight: 600; }
.testbar button { background: #8a5300; color: #ffffff; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw.on { background: var(--blue); }
.sw.on i { transform: translateX(20px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .testbar { background: #3a2a10; color: #ffcf8a; } :root:not([data-theme="light"]) .testbar button { background: #ffcf8a; color: #3a2a10; } }
/* 3.2：课表卡片、过去的训练、完成度进度条 */
.plancard { padding: 0; overflow: hidden; }
.pc-main { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 18px 18px 14px; text-align: left; }
.pc-main b { font-size: 19px; }
.pc-main .big { font-size: 28px; font-weight: 700; }
.pc-why { font-size: 14px; color: var(--ink); opacity: .75; margin-top: -4px; }
.pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 18px 10px; border-top: 1px solid var(--line); }
.pc-foot .input { margin-top: 6px; min-height: 44px; }
.btn.wide { width: 100%; margin-top: 12px; min-height: 54px; }
.prow { position: relative; border-bottom: 1px solid var(--line); }
.lane > .prow:first-child .row::after { top: 50%; }
.add.end { min-height: 26px; pointer-events: none; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin-top: 8px; background: transparent; touch-action: pan-y; }
.range::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--blue) var(--v, 100%), var(--line) var(--v, 100%)); }
.range::-moz-range-track { height: 12px; border-radius: 6px; background: var(--line); }
.range::-moz-range-progress { height: 12px; border-radius: 6px; background: var(--blue); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -10px; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 8px rgba(15,23,32,.25), inset 0 0 0 1px rgba(15,23,32,.06); }
.range::-moz-range-thumb { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 8px rgba(15,23,32,.25); }
#pctLab { color: var(--blue); font-weight: 700; font-size: 15px; }
.sum { flex-wrap: wrap; gap: 4px 20px; }
.sum > div { white-space: nowrap; }
@media (max-width: 400px) { .sum b { font-size: 34px; } }

html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>

const PACE = 95;   // 熟练泳者每 100 码大约用时（秒），自由泳中等强度
const STROKE_ADJ = { "自由泳": 0, "仰泳": 9, "蛙泳": 16, "蝶泳": 6 };
const INT = {
  easy:   { label: "轻松", f: 1.12, lv: 1 },
  mod:    { label: "中等", f: 1.0,  lv: 2 },
  fast:   { label: "快",   f: 0.92, lv: 3 },
  sprint: { label: "冲刺", f: 0.86, lv: 4 }
};
const REST = { easy: 10, mod: 15, fast: 30, sprint: 45, drill: 15 };
const KICK = 1.4, DRILL = 1.25;
const FOCUS = { endurance: "耐力", speed: "速度", technique: "技术" };
const DRILLS = {
  "自由泳": [
    ["单臂划水", "一只手放前面不动，另一只手划，专心感受推水到大腿"],
    ["六次打腿换边", "侧身打腿六次，划一下手翻到另一侧，练身体转动和平衡"],
    ["追逐式划臂", "一只手划回来碰到另一只手，才开始下一次划水"],
    ["握拳游", "双手握拳游，逼前臂去抓水，最后几趟再张开手"],
    ["指尖拖水", "移臂时指尖轻轻划过水面，练高肘移臂"],
    ["海豚腿配自由泳手", "手划自由泳、腿打海豚腿，找划水的节奏"]
  ],
  "蛙泳": [
    ["两次蹬腿一次划手", "多一次蹬腿让身体滑得更远，体会蹬腿和划手的时机"],
    ["扶板蛙泳腿", "双手扶浮板只用腿，脚掌外翻、向后蹬水"],
    ["仰卧蛙泳腿", "躺在水面做蛙泳腿，膝盖保持在两脚之间"],
    ["握拳蛙泳", "握拳游蛙泳，用前臂压水，肘部保持在高位"],
    ["雨刷划手", "只练手往外分水的动作，肘部靠近水面，手腕低于手肘"],
    ["划手加夹腿", "腿夹住不动，只练划手和抬头换气的节奏"]
  ],
  "仰泳": [
    ["仰卧打腿", "双手贴身体两侧，脸朝上，膝盖不要露出水面"],
    ["单臂仰泳", "一只手划三下再换手，转动从髋部开始"],
    ["十二次打腿换边", "侧身打腿 12 次，划一下翻到另一侧，脊柱保持笔直"],
    ["头部不动打腿", "想象额头上放了一杯水，打腿时头完全不动"],
    ["两段式移臂", "手臂在头顶和大腿旁各停一下，找干净的移臂路线"]
  ],
  "蝶泳": [
    ["海豚腿打腿", "双腿并拢，从胸口发力像波浪一样往下传"],
    ["单臂蝶泳", "一只手放前面，另一只手划，每划一次打两次腿"],
    ["右臂左臂双臂", "右手划一次、左手划一次、双手划一次，循环"],
    ["胸部波浪", "双手伸直不划水，只用胸部和髋部做波浪，感受身体起伏"],
    ["三次打腿一次划手", "放慢节奏，把每一次划手都落在第二次打腿上"]
  ]
};

const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function tools(o) {
  const pool = o.pool;
  const fixD = d => Math.max(pool, Math.round(d / pool) * pool);
  const T = (d, stroke, inten, extra = 1) => d / 100 * strokePace(o, stroke) * INT[inten].f * extra;
  const reps = (budget, d, stroke, inten, r, max, extra) => clamp(Math.round(budget / (T(d, stroke, inten, extra) + r)), 1, max);
  // 组数太多时把每组距离加倍，避免出现 30×50 这种课表
  const fit = (budget, d0, stroke, inten, r, max = 10, extra = 1, maxD = 400) => {
    let d = fixD(d0);
    while (Math.round(budget / (T(d, stroke, inten, extra) + r)) > max && d < maxD) d = fixD(d * 2);
    return { n: reps(budget, d, stroke, inten, r, max, extra), d };
  };
  return { pool, fixD, T, fit };
}

// ---------- 每一行的可选练法 ----------
function warmOptions(o, t, S, m, B) {
  const out = [];
  for (const s of S) out.push({ key: "cont-" + s, title: "连续游", sets: [
    { n: 1, d: t.fixD(Math.round(Math.min(800, B / t.T(100, s, "easy") * 100) / 50) * 50), stroke: s, inten: "easy", rest: 0, tip: "慢慢游，把身体和呼吸调顺" }] });
  const part = t.fixD(Math.max(50, Math.round(B / t.T(100, m, "easy", 1.15) * 100 / 4 / 50) * 50));
  out.push({ key: "skps", title: "游·打腿·划手·游", sets: [
    { n: 4, d: part, stroke: m, label: "游·打腿·划手·游", inten: "easy", rest: 10, extra: 1.15, adjust: "d",
      tip: "分四段：完整游、扶板打腿、夹浮漂只划手、再完整游" }] });
  if (S.length > 1) { const f = t.fit(B, 100, m, "easy", REST.easy, 8);
    out.push({ key: "mixw", title: "混合泳姿", sets: [{ ...f, stroke: S.join(" / "), strokeKey: m, label: "混合泳姿", inten: "easy", rest: REST.easy, tip: "每组换一种泳姿，轮流来" }] }); }
  { const f = t.fit(B, 100, m, "easy", REST.easy, 8);
    out.push({ key: "build", title: "渐快游", sets: [{ ...f, stroke: m, label: "渐快游", inten: "easy", rest: REST.easy, tip: "每组比上一组快一点，最后一组到中等强度" }] }); }
  { const f = t.fit(B, 100, m, "easy", REST.easy, 8, 1.15);
    out.push({ key: "kickswim", title: "打腿+游", sets: [{ ...f, stroke: m, label: "打腿+游", inten: "easy", rest: REST.easy, extra: 1.15, tip: "每组前半段扶板打腿，后半段完整游" }] }); }
  if (S.includes("自由泳")) { const f = t.fit(B, 100, "自由泳", "easy", REST.easy, 8);
    out.push({ key: "hypo", title: "呼吸递进", sets: [{ ...f, stroke: "自由泳", label: "呼吸递进", inten: "easy", rest: REST.easy, tip: "第 1 组每 3 次划水换气，第 2 组每 5 次，第 3 组每 7 次，然后循环" }] }); }
  return out;
}

function drillOptions(o, t, S, m, B) {
  const out = [];
  for (const s of S) for (const [name, tip] of DRILLS[s]) {
    const f = t.fit(B, 50, s, "easy", REST.drill, 6, DRILL); f.n = Math.max(3, f.n);
    out.push({ key: "d-" + s + "-" + name, title: name, sub: s, sets: [{ ...f, stroke: s, label: name, inten: "easy", rest: REST.drill, extra: DRILL, tip, half: true }] });
  }
  const f = t.fit(B, 50, m, "easy", REST.drill, 8, DRILL);
  out.push({ key: "d-stream", title: "流线型滑行", sub: "不限", sets: [{ ...f, stroke: "不限泳姿", strokeKey: m, label: "流线型滑行", inten: "easy", rest: REST.drill, extra: DRILL, tip: "每次蹬壁后夹紧头部保持流线型，水下海豚腿 3 到 5 次再出水" }] });
  return out;
}

function mainOptions(o, t, S, m, B) {
  const P = t.pool, out = [];
  const one = (key, title, d0, inten, rest, tip, extra = 1, max = 10, stroke = m) => {
    const f = t.fit(B, d0, stroke, inten, rest, max, extra, o.focus === "endurance" ? 400 : Math.max(d0 * 2, 100));
    const block = f.n * (t.T(f.d, stroke, inten, extra) + rest);
    const k = Math.round(B / (block + 20));
    if (o.focus !== "endurance" && k >= 2) {   // 短距离组排不满时间，就整组重复几轮
      const outer = Math.min(k, 3);
      out.push({ key, title, sub: stroke, composite: true, roundsAdj: true, outer, sets: [{ ...f, stroke, label: "", inten, rest, extra, tip }] });
      return;
    }
    out.push({ key, title, sets: [{ ...f, stroke, label: title, inten, rest, extra, tip }] });
  };
  const ladderOpt = (key, title, sizes, tip) => {
    const time = arr => arr.reduce((s, d) => s + t.T(d, m, "mod") + REST.mod, 0);
    let ladder = sizes[0].map(t.fixD);
    for (const s of sizes) { const l = s.map(t.fixD); if (time(l) <= B * 1.1) ladder = l; }
    const rounds = clamp(Math.round(B / time(ladder)), 1, 4);
    out.push({ key, title, sets: [{ ladder, rounds, stroke: m, label: title, inten: "mod", rest: REST.mod, tip }] });
  };
  const withRecover = (key, title, d0, inten, tip, extra = 1, stroke = m) => {
    const f = t.fit(B * 0.75, d0, m, inten, REST[inten], 16, extra, d0);   // 速度组保持短距离
    const r = t.fit(B * 0.25, 100, m, "easy", REST.easy, 4);
    const block = f.n * (t.T(f.d, m, inten, extra) + REST[inten]) + r.n * (t.T(r.d, m, "easy") + REST.easy);
    const fast = { ...f, stroke, strokeKey: m, label: title, inten, rest: REST[inten], extra, tip };
    const easy = { ...r, stroke: m, label: "放松游", inten: "easy", rest: REST.easy, tip: "快游之后慢下来，让心跳回落" };
    if (B / (block + 20) >= 1.5) {   // 排不满时间：快游 + 4×50 放松作为一轮，重复几轮
      const e = { ...easy, n: 4, d: t.fixD(50), label: "放松" };
      const block2 = f.n * (t.T(f.d, m, inten, extra) + REST[inten]) + 4 * (t.T(e.d, m, "easy") + REST.easy) + 20;
      out.push({ key, title, sub: stroke, composite: true, roundsAdj: true, outer: clamp(Math.round(B / block2), 2, 3), sets: [{ ...fast, label: "" }, e] });
      return;
    }
    out.push({ key, title, sets: [fast, easy] });
  };

  if (o.focus === "endurance") {
    one("mid", "中距离分组", 100, "mod", REST.mod, "每组用时尽量一样，后半程不掉速");
    one("long", "长距离分组", 200, "mod", REST.mod, "找到能一直保持的节奏，每组都游得一样");
    one("xlong", "超长分组", 400, "mod", 20, "当成一段长距离来游，中间不要停", 1, 8);
    ladderOpt("pyr", "金字塔", [[50, 100, 150, 100, 50], [50, 100, 150, 200, 150, 100, 50], [100, 200, 300, 200, 100]], "距离先变长再变短，每一段都保持同样的节奏");
    ladderOpt("ladder", "阶梯递增", [[100, 200, 300], [100, 200, 300, 400], [100, 200, 300, 400, 500]], "距离一段比一段长，速度保持不变");
    one("desc", "递减游", 100, "mod", REST.mod, "每 4 组一轮，一组比一组快，第 4 组最快");
    one("neg", "后程加速", 200, "mod", REST.mod, "每组后半程要比前半程快");
    { // 逐组减一趟
      const lenT = k => k * t.T(P, m, "mod") + 20;
      let L = 3; while (L < 14) { let s = 0; for (let k = 1; k <= L + 1; k++) s += lenT(k); if (s > B * 1.05) break; L++; }
      const ladder = []; for (let k = L; k >= 1; k--) ladder.push(k * P);
      out.push({ key: "minus1", title: "逐组减一趟", sets: [{ ladder, rounds: 1, stroke: m, label: "逐组减一趟", inten: "mod", rest: 20, tip: `先连续游 ${L} 趟，歇 20 秒，再游 ${L - 1} 趟，一直减到 1 趟` }] });
    }
    if (m === "自由泳") one("hypo", "控制呼吸", 100, "mod", REST.mod, "每 5 次划水换一次气，憋不住就改回 3 次");
    one("pull", "划手组", 200, "mod", REST.mod, "两腿夹浮漂，只用手划，专心抱水和推水", 1.05);
    one("kick", "打腿组", 100, "mod", REST.mod, "扶板打腿，每组用时尽量一样", KICK);
  } else if (o.focus === "speed") {
    withRecover("f50", "50 码快游", 50, "fast", "每组都全力游，休息要歇够，保证下一组还能快");
    withRecover("f100", "100 码快游", 100, "fast", "前 50 码稳住，后 50 码顶住不掉速");
    if (P === 25) withRecover("s25", "25 码冲刺", 25, "sprint", "从蹬壁开始全力，一口气冲到对面");
    if (P === 25) withRecover("broken", "分段 100", 100, "fast", "每组拆成 50 + 25 + 25，中间各歇 10 秒和 5 秒，一段比一段快");
    else withRecover("broken", "分段 200", 200, "fast", "每组拆成 100 + 50 + 50，中间各歇 10 秒和 5 秒，一段比一段快");
    withRecover("descf", "递减快游", 50, "fast", "每 4 组一轮，第 1 组中等，第 4 组全力");
    withRecover("build50", "渐快 50", 50, "fast", "每组从慢到快，最后几下全力");
    withRecover("negf", "后程冲刺", 100, "fast", "前半程中等，后半程全力冲");
    if (S.length > 1) withRecover("rot", "各泳姿冲刺", P === 25 ? 25 : 50, "sprint", "每组换一种泳姿，全力游", 1, S.join(" / "));
    withRecover("kickf", "打腿冲刺", 50, "fast", "扶板全力打腿", KICK);
  } else {
    one("count", "数划水", 100, "mod", REST.mod, "数每趟划水次数，下一组试着少划一下");
    one("half", "半程动作", 50, "mod", REST.mod, "前半趟想着刚才练的动作，后半趟正常游，对比感觉");
    one("focus200", "分段关注点", 200, "mod", REST.mod, "每 50 码换一个关注点：入水、抱水、推水、打腿");
    one("drillswim", "练习加游", 100, "mod", REST.mod, "每组前半段做刚才的技术练习，后半段完整游", 1.1);
    one("rate", "高频划水", 50, "mod", REST.mod, "划水频率加快，但不用蛮力，保持动作完整");

  return `${s.half ? "前半练习后半正常游，" : ""}@${fmtPace(sendoff(s))} 出发，每组歇约 ${s.rest} 秒`;
}
function plainText(s) { return `${bigQty(s)}${s.ladder && s.label !== "逐组减一趟" ? "" : " 码"}，${subText(s)}`; }
function dailyTip() {
  const all = Object.entries(DRILLS).flatMap(([st, l]) => l.map(([n, t]) => ({ st, n, t })));
  const d = nowDate(), k = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
  return all[k % all.length];
}
function cfgKey(c) { return JSON.stringify([c.o, c.ms, c.rows.map(r => [r.type, r.key, r.adj])]); }
function isSaved() { const k = cfgKey(cfg()); return S.favs.some(f => cfgKey(f.cfg) === k); }
function fmtPace(sec) { sec = Math.round(sec); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }

/*
 * 游泳训练推荐：离线、确定性、无 DOM / import / 存储 / 网络 / 随机数。
 * 四个公开函数见下方；swimAlgo* 是纯函数辅助工具。
 * 资料核对：2026-10-13。来源链接仅为注释，运行时不会访问。
 *
 * 证据与经验值：
 * 1. 按“课次的主要目的”分配，不是按距离或强度区间分配。
 *    耐力/速度/技术：fit=50/15/35，endur=65/10/25，stroke=25/10/65，
 *    team=40/25/35，均为经验值；未发现这些业余目标的官方统一比例。
 *    技术贯穿所有课的依据（不能据此推出以上百分比）：
 *    https://www.swimming.org/members/swimming-fitness-training-plan/
 * 2. session-RPE × 分钟是负荷指标，单位 AU：
 *    https://pubmed.ncbi.nlm.nih.gov/11708692/
 *    注意：题给 mins 是计划时长，这里严格用该字段，所以是负荷代理值，
 *    不是基于实际时长的严格 session-RPE 负荷。rpe=0 有效，null 未知。
 * 3. 周增幅 10% 是保守提醒阈值（经验值），不是安全保证。
 *    背景：https://bjsm.bmj.com/content/50/5/273
 *    反面证据：https://pmc.ncbi.nlm.nih.gov/articles/PMC6253751/
 *    后者为跑步系统综述，不能直接外推游泳，也不支持普适 10% 安全线。
 * 4. RPE>=8、RPE>=7、完成率<75% / <95% 的疲劳及减组阈值均为经验值。
 *    单次 RPE 不是过度训练诊断；只是短期安排的保守信号。
 *    监控恢复的背景：https://pmc.ncbi.nlm.nih.gov/articles/PMC6683628/
 * 5. 高强度间隔至少 48 小时：经验值；上述游泳研究支持额外恢复，
 *    未给业余游泳统一小时数。只有日期时要求相差>=3个日历日，
 *    相差2日可能实际不足48小时；相差3日通常能留足恢复时间。
 *    日期不能校验精确小时，跨夏令时也可能不足48小时；需时间戳才能硬保证。
 *    speed 或 RPE>=7 视为高强度；计划中只把 fast/sprint 速度课算高强度。
 * 6. 停训>=7 / >=14 / >=30日，首周时长目标恢复到此前的80% / 60% / 50%，
 *    均为经验值，时长再向下取30/45/60/90，配合降强度、减组。
 *    每周1次、恰好相隔7日视为正常节奏。恢复限制保持到回归后的第7日。
 *    渐进回归依据（不提供以上恢复百分比）：
 *    https://www.usms.org/fitness-and-training/articles-and-videos/articles/five-swim-workouts-for-returning-to-swimming-after-a-long-break
 *
 * 接口约定：
 * - today 是用户当地的 YYYY-MM-DD；UTC 仅用于日历运算，避免 DST 差一天。
 * - thisWeek=[today-6,today]，lastWeek=[today-13,today-7]，是滚动窗口。
 * - weekPlan 是含 today 的未来7个日历日，严格安排 weekly 个未来训练日；
 *   今日已完成的课不重复安排，历史课不占这个未来计划的名额。
 * - 休息行 focus=null、minutes=0；训练行才有 focus 和合法训练时长。
 * - 非法字段抛 TypeError / RangeError；未来日志忽略；输入不修改。
 * - 无ID无法识别重复日志，不自动去重；同日多课均累计，疲劳取同日最大RPE。
 * - pace/strokes/paceUnit 按题给格式校验；此接口不选泳姿、不算配速或距离，
 *   不据配速猜测体能，不混合米/码。完成率要求同一条日志dist/planned同单位。
 * - 返回的强度上限用于短段训练强度，不代表整节课的 session-RPE。
 *   minutes含休息、热身与放松，不要求初学者连续游满该时长。
 * - 30分钟下限、未知实际RPE以及未知标准组长，使这些接口无法硬性保证
 *   10%增幅或精确恢复百分比。低量时仍返回30分钟easy并减组，不能强行补课。
 *   生成具体课表时也须限制实际总距离；减2组应由调用方钳制到非负组数。
 * - weekPlan 是暂定安排；不伪造未来完成率/RPE，每次训练前用真实logs重算。
 */

function swimAlgoRules() {
  return {
    // 以下所有数值阈值均为经验值，依据与适用限制见文件头。
    weights: {
      fit: { endurance: 0.50, speed: 0.15, technique: 0.35 },
      endur: { endurance: 0.65, speed: 0.10, technique: 0.25 },
      stroke: { endurance: 0.25, speed: 0.10, technique: 0.65 },
      team: { endurance: 0.40, speed: 0.25, technique: 0.35 }
    },
    levelMinutes: { l50: 30, l200: 45, l800: 60, l1500: 90 },
    growth: 1.10,
    hardDayGap: 3,
    longWindowWeight: 0.35
  };
}

function swimAlgoDay(date) {
  if (typeof date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    throw new TypeError("日期必须是 YYYY-MM-DD");
  }
  const ms = Date.parse(date + "T00:00:00Z");
  if (!Number.isFinite(ms) || new Date(ms).toISOString().slice(0, 10) !== date) {
    throw new RangeError("日期不存在");
  }
  return ms / 86400000;
}

function swimAlgoDate(day) {
  return new Date(day * 86400000).toISOString().slice(0, 10);
}

function swimAlgoProfile(profile) {
  const strokes = ["自由泳", "仰泳", "蛙泳", "蝶泳"];
  if (!profile || !["fit", "endur", "stroke", "team"].includes(profile.goal) ||
      !["l50", "l200", "l800", "l1500"].includes(profile.level) ||
      !Number.isInteger(profile.weekly) || profile.weekly < 1 || profile.weekly > 4 ||
      ![30, 45, 60, 90].includes(profile.minutes) ||
      !["米", "码"].includes(profile.paceUnit) ||
      !Array.isArray(profile.strokes) ||
      profile.strokes.some(stroke => !strokes.includes(stroke)) ||
      !profile.pace || typeof profile.pace !== "object" || Array.isArray(profile.pace) ||
      Object.keys(profile.pace).some(stroke => !strokes.includes(stroke) ||
        !Number.isFinite(profile.pace[stroke]) || profile.pace[stroke] <= 0)) {
    throw new TypeError("profile 不符合约定格式");
  }
}

function swimAlgoLogs(logs, day) {
  if (!Array.isArray(logs)) throw new TypeError("logs 必须是数组");
  const rows = logs.map(log => {
    if (!log || !["endurance", "speed", "technique"].includes(log.focus) ||
        !Number.isFinite(log.dist) || log.dist < 0 ||
        !Number.isFinite(log.planned) || log.planned < 0 ||
        !Number.isFinite(log.mins) || log.mins <= 0 ||
        !(log.rpe === null || (Number.isFinite(log.rpe) && log.rpe >= 0 && log.rpe <= 10))) {
      throw new TypeError("训练日志不符合约定格式");
    }
    return { ...log, day: swimAlgoDay(log.date) };
  }).filter(log => log.day <= day);
  // 同日无时间戳，按最大RPE优先保护恢复；其余字段打破平局，避免依赖输入顺序。
  return rows.sort((a, b) => a.day - b.day ||
    (a.rpe === null ? -1 : a.rpe) - (b.rpe === null ? -1 : b.rpe) ||
    (a.focus < b.focus ? -1 : a.focus > b.focus ? 1 : 0) ||
    a.dist - b.dist || a.planned - b.planned || a.mins - b.mins);
}

function swimAlgoWindow(rows, day, from, to) {
  return rows.filter(row => day - row.day >= from && day - row.day <= to);
}

function swimAlgoLoad(rows) {
  return rows.reduce((sum, row) => sum + (row.rpe === null ? 0 : row.rpe * row.mins), 0);
}

function swimAlgoLoadInfo(rows, day) {
  const current = swimAlgoWindow(rows, day, 0, 6);
  const previous = swimAlgoWindow(rows, day, 7, 13);
  const thisWeek = swimAlgoLoad(current);
  const lastWeek = swimAlgoLoad(previous);
  return {
    current, previous, thisWeek, lastWeek,
    complete: current.concat(previous).every(row => row.rpe !== null)
  };
}

function weeklyLoad(logs, today) {
  const day = swimAlgoDay(today);
  const info = swimAlgoLoadInfo(swimAlgoLogs(logs, day), day);
  const warnings = [];
  if (!info.complete) warnings.push("有记录未填累度，训练量仅为已知部分");
  if (info.lastWeek === 0 && info.current.length > 0) {
    warnings.push("上周缺少有效负荷基线，先慢慢来");
  } else if (info.complete && info.thisWeek > info.lastWeek * swimAlgoRules().growth) {
    warnings.push("这周训练量涨得有点快，轻松些吧");
  }
  return {
    thisWeek: info.thisWeek,
    lastWeek: info.lastWeek,
    // 数据不完整或零分母时不可比较，不用0或Infinity冒充百分比。
    changePct: info.complete && info.lastWeek > 0
      ? Math.round((info.thisWeek / info.lastWeek - 1) * 1000) / 10 : null,
    warning: warnings.join("；")
  };
}

function swimAlgoCompletion(row) {
  return row && row.planned > 0 ? row.dist / row.planned : null;
}

function swimAlgoFloorMinutes(target) {
  // 不足30仍返回30，源于接口下限，不表示应强撑30分钟。
  return [30, 45, 60, 90].filter(minutes => minutes <= target).pop() || 30;
}

function swimAlgoReturn(profile, rows, day) {
  if (rows.length === 0) return null;
  const dates = [...new Set(rows.map(row => row.day))];
  const lastDay = dates[dates.length - 1];
  function interrupted(gap) {
    return gap >= 7 && gap > Math.ceil(7 / profile.weekly);
  }
  let gap = day - lastDay;
  let anchor = day;
  let before = lastDay;
  if (!interrupted(gap)) {
    // 已经回归后保持首周限制，不因新增一条轻松日志马上恢复到原量。
    let found = false;
    for (let i = dates.length - 1; i > 0; i -= 1) {
      if (day - dates[i] >= 7) break;
      if (interrupted(dates[i] - dates[i - 1])) {
        gap = dates[i] - dates[i - 1];
        anchor = dates[i];
        before = dates[i - 1];
        found = true;
        break;
      }
    }
    if (!found) return null;
  }
  const prior = rows.filter(row => row.day <= before).slice(-4);
  const baseMinutes = prior.reduce((sum, row) => sum + row.mins, 0) / prior.length;
  return { gap, anchor, baseMinutes, factor: gap >= 30 ? 0.50 : gap >= 14 ? 0.60 : 0.80 };
}

function swimAlgoState(profile, rows, day, planned) {
  const all = rows.concat(planned).sort((a, b) => a.day - b.day);
  const latest = rows[rows.length - 1] || null;
  const lastDay = all.length ? all[all.length - 1].day : null;
  const gap = lastDay === null ? null : day - lastDay;
  const recent = swimAlgoWindow(all, day, 0, 6);
  const load = swimAlgoLoadInfo(rows, day);
  const plannedLoad = swimAlgoWindow(planned, day, 0, 6)
    .reduce((sum, row) => sum + row.estimatedLoad, 0);
  const knownLatestGap = latest ? day - latest.day : null;
  // 疲劳信号只来自真实记录，绝不用预计的完成率或RPE。
  const fatigue = !!latest && knownLatestGap < 3 &&
    (latest.rpe >= 8 || (latest.rpe === 7 && knownLatestGap < 2) ||
      (swimAlgoCompletion(latest) !== null && swimAlgoCompletion(latest) < 0.75));
  const hard = all.filter(row => row.estimatedLoad !== undefined ? row.hard :
    row.focus === "speed" || (row.rpe !== null && row.rpe >= 7));
  const hardGap = hard.length ? day - hard[hard.length - 1].day : Infinity;
  const recovery = swimAlgoReturn(profile, rows, day);
  const enough = new Set(recent.map(row => row.day)).size >= profile.weekly;
  const overloaded = load.complete && load.lastWeek > 0 &&
    load.thisWeek + plannedLoad > load.lastWeek * swimAlgoRules().growth;
  const missing = !load.complete;
  return { all, latest, gap, recent, load, plannedLoad, fatigue, hardGap,
    recovery, enough, overloaded, missing };
}

function swimAlgoEstimatedRpe(focus, cap) {
  // 整节课预算假设：easy技术2、easy其他3、mod4、fast5、sprint6，经验值。
  // 仅用于预估预算，绝不写入logs或weeklyLoad，亦不是强度与RPE的等价关系。
  return cap === "easy" ? (focus === "technique" ? 2 : 3) :
    cap === "mod" ? 4 : cap === "fast" ? 5 : 6;
}

function swimAlgoDecision(profile, rows, day, planned) {
  const rules = swimAlgoRules();
  const state = swimAlgoState(profile, rows, day, planned);
  const base = Math.min(profile.minutes, rules.levelMinutes[profile.level]);
  let minutes = base;
  let focus = "technique";
  let intensityCap = "mod";
  let why = "轻松练技术，找找水感";
  let budgetLimited = false;
  // 新用户先建基线；之前的旧日志不能拿来证明当前已准备好冲刺。
  if (rows.length === 0) {
    minutes = 30;
    intensityCap = "easy";
    why = "先找找水感，轻松开始";
  } else if (state.gap === 0) {
    minutes = 30;
    intensityCap = "easy";
    why = "今天已经游过，轻松就好";
  } else if (state.fatigue) {
    minutes = swimAlgoFloorMinutes(base * 0.60); // 疲劳减到60%时长目标，经验值。
    intensityCap = "easy";
    why = "上次有点累，今天轻松点";
  } else if (state.enough || state.overloaded) {
    minutes = 30;
    intensityCap = "easy";
    why = "这周量够啦，轻松练技术";
  } else {
    const weight = { ...rules.weights[profile.goal] };
    // l50/l200不主动安排高强度速度课；把其课次份额移给技术，经验值。
    if (profile.level === "l50" || profile.level === "l200") {
      weight.technique += weight.speed;
      weight.speed = 0;
    }
    const recent14 = swimAlgoWindow(state.all, day, 0, 13);
    const candidates = ["technique", "endurance", "speed"].filter(candidate =>
      weight[candidate] > 0 && (candidate !== "speed" ||
        (state.hardGap >= rules.hardDayGap && !state.missing && !state.recovery &&
          state.all[state.all.length - 1].focus !== "speed")));
    function deficit(candidate) {
      const count7 = state.recent.filter(row => row.focus === candidate).length;
      const count14 = recent14.filter(row => row.focus === candidate).length;
      return weight[candidate] * (state.recent.length + 1) - count7 +
        rules.longWindowWeight * (weight[candidate] * (recent14.length + 1) - count14);
    }
    // 固定平局优先级：技术、耐力、速度；不依赖对象枚举或随机。
    focus = candidates.reduce((best, candidate) =>
      deficit(candidate) > deficit(best) + 1e-9 ? candidate : best, candidates[0]);
    intensityCap = focus === "technique" || profile.level === "l50" ? "easy" : "mod";
    why = focus === "endurance" ? "稳稳游一会儿，攒点耐力" :
      focus === "speed" ? "换点短距离，试试轻快节奏" : "轻松练技术，找找水感";
    if (focus === "speed") {
      const recentKnown = swimAlgoWindow(rows, day, 1, 13)
        .filter(row => row.rpe !== null);
      const ready = recentKnown.slice(-2);
      if (ready.length === 2 && ready.every(row => row.rpe <= 6 &&
          swimAlgoCompletion(row) !== null && swimAlgoCompletion(row) >= 0.95)) {
        intensityCap = "fast";
        if (profile.goal === "team" && profile.level === "l1500" &&
            ready.every(row => row.rpe <= 5)) intensityCap = "sprint";
      }
    }
    if (state.hardGap < rules.hardDayGap || state.missing) intensityCap = "easy";
    if (state.recovery) {
      minutes = swimAlgoFloorMinutes(Math.min(base, state.recovery.baseMinutes) * state.recovery.factor);
      intensityCap = state.recovery.gap >= 14 ? "easy" : intensityCap;
      if (state.recovery.gap >= 14 && state.recovery.anchor === day) focus = "technique";
      why = "回来先找水感，慢慢恢复";
    } else if (state.missing) {
      minutes = swimAlgoFloorMinutes(base * 0.80); // 缺RPE时少20%，经验值。
      why = "累度还不清楚，先轻松游";
    } else if (state.recent.length < profile.weekly &&
        state.gap >= Math.ceil(7 / profile.weekly)) {
      why = "按自己的节奏，慢慢续上";
    }
    // 不把“本周少游”解释为欠账。单次时长也不直接跳到用户新设的大时长。
    if (!state.recovery && state.latest) {
      minutes = swimAlgoFloorMinutes(Math.min(minutes, state.latest.mins * rules.growth));
    }
    // 加入候选课后超出周预算时，先降强度、再缩短，不试图用高强度补量。
    if (state.load.complete && state.load.lastWeek > 0 &&
        state.load.thisWeek + state.plannedLoad +
        swimAlgoEstimatedRpe(focus, intensityCap) * minutes > state.load.lastWeek * rules.growth) {
      budgetLimited = true;
      focus = "technique";
      intensityCap = "easy";
      const remaining = state.load.lastWeek * rules.growth - state.load.thisWeek - state.plannedLoad;
      minutes = swimAlgoFloorMinutes(Math.min(minutes, remaining / 2));
      why = "这周慢慢加，先轻松练技术";
    }
  }
  return { recommendation: { focus, minutes, intensityCap, why }, budgetLimited };
}

function recommendToday(profile, logs, today) {
  swimAlgoProfile(profile);
  const day = swimAlgoDay(today);
  return swimAlgoDecision(profile, swimAlgoLogs(logs, day), day, []).recommendation;
}

function mainSetAdjust(profile, logs, focus, today) {
  swimAlgoProfile(profile);
  if (!["endurance", "speed", "technique"].includes(focus)) {
    throw new TypeError("focus 不符合约定格式");
  }
  const day = swimAlgoDay(today);
  const rows = swimAlgoLogs(logs, day);
  const state = swimAlgoState(profile, rows, day, []);
  const same = rows.filter(row => row.focus === focus);
  const last = same[same.length - 1];
  const ratio = swimAlgoCompletion(last);
  // 恢复/周预算优先，不能因同类旧课很轻松而忽略昨天另一课很累。
  if (state.fatigue || state.gap === 0 || state.enough || state.overloaded ||
      (state.recovery && state.recovery.gap >= 14)) return -2;
  if (state.recovery || (focus === "speed" && state.hardGap < swimAlgoRules().hardDayGap)) return -1;
  if (!last) return 0;
  if (last.rpe >= 8 || (ratio !== null && ratio < 0.75)) return -2;
  if (last.rpe === 7 || (ratio !== null && ratio < 0.95)) return -1;
  // 无计划距离、无RPE、记录太旧，不加量。超过100%不另奖额外组数。
  if (ratio === null || last.rpe === null || state.missing || day - last.day >= 14) return 0;
  if (last.rpe >= 6) return 0;
  if (swimAlgoDecision(profile, rows, day, []).budgetLimited) return -1;
  // 连续两次轻松完成才能加2/3组；初级每次最多加1组，均为经验值。
  const prior = same[same.length - 2];
  if ((profile.level === "l800" || profile.level === "l1500") && prior &&
      day - prior.day < 14 && prior.rpe !== null && prior.rpe <= 4 &&
      swimAlgoCompletion(prior) !== null && swimAlgoCompletion(prior) >= 0.95 && last.rpe <= 4) {
    return profile.level === "l1500" && prior.rpe <= 3 && last.rpe <= 3 ? 3 : 2;
  }
  return 1;
}

function weekPlan(profile, logs, today) {
  swimAlgoProfile(profile);
  const day = swimAlgoDay(today);
  const rows = swimAlgoLogs(logs, day);
  const state = swimAlgoState(profile, rows, day, []);
  // 默认均匀铺开；刚游过/很累则把第一课后移，其余仍满足weekly课次。
  let start = state.gap !== null && state.gap <= 1 ? 1 : 0;
  if (state.fatigue) start = Math.max(start, 3 - state.gap);
  start = Math.min(start, 7 - profile.weekly);
  const offsets = Array.from({ length: profile.weekly }, (_, i) =>
    start + Math.floor(i * (7 - start) / profile.weekly));
  const projected = [];
  const plan = [];
  for (let offset = 0; offset < 7; offset += 1) {
    const date = swimAlgoDate(day + offset);
    if (!offsets.includes(offset)) {
      plan.push({ date, rest: true, focus: null, minutes: 0, why: "歇一歇，下次更有精神" });
      continue;
    }
    const recommendation = swimAlgoDecision(profile, rows, day + offset, projected).recommendation;
    plan.push({ date, rest: false, focus: recommendation.focus,
      minutes: recommendation.minutes, why: recommendation.why });
    // 仅用于后续课的课型平衡、间隔和预算；不冒充真实日志，不传给weeklyLoad。
    projected.push({ day: day + offset, focus: recommendation.focus,
      estimatedLoad: recommendation.minutes *
        swimAlgoEstimatedRpe(recommendation.focus, recommendation.intensityCap),
      hard: recommendation.focus === "speed" &&
        ["fast", "sprint"].includes(recommendation.intensityCap) });
  }
  return plan;
}

// ================= 3.0：档案、推荐、页面 =================
const VERSION = "3.2";
const TEST_TOOLS = false;   // 测试模式开关：改成 true 才会在“我的”里出现
const GOALS = { fit: "健身", endur: "提高耐力", stroke: "练好泳姿", team: "准备进泳队" };
const LEVELS = { l50: ["50 以内", 50], l200: ["200 左右", 200], l800: ["800 左右", 800], l1500: ["1500 以上", 1500] };
const LEVEL_MAXD = { l50: 50, l200: 100, l800: 200, l1500: 400 };     // 单组最长距离
const LEVEL_PACE = { l50: 170, l200: 135, l800: 110, l1500: 92 };     // 不知道速度时的估计（自由泳每 100 秒）
const SPEEDS = [[160, "2:30 以上"], [120, "2:00 左右"], [100, "1:40 左右"], [85, "1:25 左右"], [72, "1:15 以内"]];
const STROKES = ["自由泳", "仰泳", "蛙泳", "蝶泳"];
// 一周里三种训练的目标比例：按用户的目标来定
const TARGET = {
  fit:    { endurance: .5,  technique: .3,  speed: .2 },
  endur:  { endurance: .6,  technique: .2,  speed: .2 },
  stroke: { endurance: .3,  technique: .55, speed: .15 },
  team:   { endurance: .4,  technique: .3,  speed: .3 }
};
const DEFAULT_PROFILE = { onboarded: false, pool: "25y", goal: "fit", level: "l200", strokes: ["自由泳", "蛙泳"], pace: {}, paceUnit: "码", weekly: 2, minutes: 45, equip: [] };
const FCOLOR = { endurance: "var(--blue)", technique: "var(--purple)", speed: "var(--coral)" };
const PH_TINT = { warm: "var(--ph-warm)", drill: "var(--ph-drill)", main: "var(--blue)", extra: "var(--blue)", cool: "var(--ph-cool)" };

const P = () => S.profile;
const unitOf = () => POOLS[P().pool][1];
function convPace(sec, from, to) { return from === to ? sec : to === "米" ? sec * 1.0936 : sec / 1.0936; }

// 每种泳姿的速度：填了就用；没填就按其他泳姿推算；都没有就按水平估计
function strokePace(o, stroke) {
  const pr = P(), unit = (o && o.unit) || unitOf(), own = pr.pace || {};
  const key = STROKE_ADJ[stroke] !== undefined ? stroke : "自由泳";
  let base;
  if (own[key]) base = own[key];
  else {
    const known = Object.keys(own).filter(k => own[k] && STROKE_ADJ[k] !== undefined);
    base = known.length
      ? known.reduce((a, k) => a + own[k] - STROKE_ADJ[k], 0) / known.length + STROKE_ADJ[key]
      : LEVEL_PACE[pr.level] + STROKE_ADJ[key];
    return convPace(base, "码", unit);
  }
  return convPace(base, pr.paceUnit || "码", unit);
}
function mainPace() { const st = P().strokes.length ? P().strokes : ["自由泳"]; return Math.min(...st.map(s => strokePace({ unit: unitOf() }, s))); }

// 按水平过滤练法：单组不超过能力范围，连续游不超过能连续游的距离
function optionsFor(type) {
  const lv = P().level, maxD = LEVEL_MAXD[lv], cont = LEVELS[lv][1];
  let list = baseOptionsFor(type).filter(op => op.key !== "hypo");       // 不安排憋气类的控制呼吸
  const longest = op => Math.max(...op.sets.map(s => s.ladder ? Math.max(...s.ladder) : s.n === 1 ? 0 : s.d));
  const ok = list.filter(op => longest(op) <= maxD);
  if (ok.length) list = ok;
  const cap = S.o.cap ? INT_ORDER.indexOf(S.o.cap) : 3;
  if (cap < 3) list = list.map(op => op.sets.some(s => INT_ORDER.indexOf(s.inten) > cap)
    ? { ...op, capped: true, sets: op.sets.map(s => INT_ORDER.indexOf(s.inten) > cap ? { ...s, inten: INT_ORDER[cap], tip: s.tip + "。今天强度控制在“" + INT[INT_ORDER[cap]].label + "”就好，别用全力" } : s) } : op);
  return list.map(op => op.sets.some(s => s.n === 1 && !s.ladder && s.d > cont)
    ? { ...op, sets: op.sets.map(s => s.n === 1 && !s.ladder && s.d > cont ? { ...s, d: Math.max(S.o.pool, Math.floor(cont / S.o.pool) * S.o.pool) } : s) }
    : op);
}

// ---------- 水波打卡 ----------
function ripple(size) {
  const r = size / 2, days = weekDays(), logged = new Set(S.logs.map(l => l.date)), today = todayStr();
  let o = `<div class="rip" style="width:${size}px;height:${size}px">`;
  [[1, .4], [.8, .6], [.6, .85]].forEach(([f, a]) => { const s = size * f; o += `<i style="left:${(size - s) / 2}px;top:${(size - s) / 2}px;width:${s}px;height:${s}px;opacity:${a}"></i>`; });
  const s = size * .6; o += `<b class="core" style="left:${(size - s) / 2}px;top:${(size - s) / 2}px;width:${s}px;height:${s}px"></b>`;
  days.forEach((d, k) => {
    const a = -Math.PI / 2 + k * 2 * Math.PI / 7, x = r + r * Math.cos(a), y = r + r * Math.sin(a);
    const cls = logged.has(d) ? "on" : d === today ? "now" : "";
    o += `<span class="dot ${cls}" style="left:${x - 8}px;top:${y - 8}px"></span>`;
    const lx = r + (r + 20) * Math.cos(a), ly = r + (r + 20) * Math.sin(a);
    o += `<span class="dl ${d === today ? "now" : ""}" style="left:${lx - 14}px;top:${ly - 9}px">${d === today ? "今天" : "一二三四五六日"[k]}</span>`;
  });
  const n = weekLogs().length, swamToday = S.logs.some(l => l.date === today);
  const mid = swamToday ? `<span>今天已经下过水</span><strong>${n}</strong><span>这周第 ${n} 次</span>`
    : `<span>这周第</span><strong>${n + 1}</strong><span>次下水?</span>`;
  return o + `<div class="mid">${mid}</div></div>`;
}

  return `<div class="dhero"><small>${x.def.name}${comp && x.opt.src ? " · 来自 USMS / Swim England 公开课表" : ""}</small>
      <h2>${comp ? esc(x.opt.title) + " · " + esc(x.opt.sub) : esc(nameOf(s))}</h2>
      <div class="dq num">${comp ? (s.outer > 1 ? `${s.outer} 轮` : x.dist.toLocaleString()) : bigQty(s)}<small>${comp && s.outer > 1 ? `共 ${x.dist.toLocaleString()} ${U}` : U}</small></div>
      <small>约 ${Math.max(1, Math.round(x.secs / 60))} 分钟</small></div>
    <div class="card info">
      <div><span class="lab">怎么游</span>${how}${extraSets}</div>
      <div><span class="lab">用多大力</span><p>${[...new Set(x.sets.map(e => e.inten))].map(k => `${INT[k].label}：${INT_DESC[k]}`).join("<br>")}。</p></div>
      <div><span class="lab">动作要点</span><p>${esc(s.tip)}。</p></div>
    </div>`;
}
function ensureToday() { if (!S.rows.length || S.planDate !== todayStr()) makeRecommended(); }
function pctOf(l) { return l.pct != null ? l.pct : l.planned ? Math.round(l.dist / l.planned * 100) : 100; }

// ---------- 页面 ----------
const V = {
  home() {
    const wl = weekLogs(), yd = wl.reduce((a, l) => a + l.dist, 0), mins = wl.reduce((a, l) => a + (l.mins || 0), 0);
    const cnt = { endurance: 0, technique: 0, speed: 0 }; wl.forEach(l => cnt[focusOf(l)]++);
    const rec = recommendFocus(), tip = dailyTip(), U = unitOf();
    const recent = logsDesc().slice(0, 2);
    const favs = S.favs.slice(0, 2);
    const hasToday = S.rows.length && S.planDate === todayStr();
    const goal = P().weekly;
    return testBanner() + `<div class="date">${dateLine()}</div><h1 class="hi">${greet()}</h1>
      ${ripple(Math.round(clamp((window.innerHeight || 844) * 0.27, 176, 244)))}
      <button class="go" data-act="start">${hasToday ? "继续今天的训练" : "开始今天的训练"}</button>
      <div class="tiles">
        <div class="tl"><small>本周</small><b class="num">${yd.toLocaleString()}</b><em>${U}</em></div>
        <div class="tl"><small>本周时长</small><b class="num">${mins}</b><em>分钟</em></div>
        <div class="tl"><small>我的速度</small><b class="num">${fmtPace(mainPace())}</b><em>每 100 ${U}</em></div>
      </div>
      <div class="sec"><b>今日小贴士</b><span>每天换一条</span></div>
      <div class="card tip"><div class="tic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 14c2 0 2-2 4.5-2S10 14 12 14s2-2 4.5-2S19 14 21 14M7 9l3-3 3 3"/></svg></div>
        <div><b>${esc(tip.n)}</b><p>${esc(tip.st)}：${esc(tip.t)}。</p></div></div>
      <div class="sec"><b>本周练了什么</b><span>目标 ${goal} 次</span></div>
      <div class="card"><div class="bal">${FOCI.map(f => `<div class="bl"><span>${FOCUS[f]}</span><div class="tr"><i style="width:${Math.min(100, cnt[f] / Math.max(1, goal) * 100)}%;background:${FCOLOR[f]}"></i></div><b class="num ${cnt[f] ? "" : "zero"}">${cnt[f]}</b></div>`).join("")}</div>
        <p class="hint">${wl.length >= goal ? "这周的目标已经完成了，多游一次也很好。" : `下一次建议练${FOCUS[rec.focus]}：${rec.why}。`}</p></div>
      <div class="sec"><b>最近训练</b>${S.logs.length ? `<button data-go="hist">全部 ›</button>` : ""}</div>
      ${recent.length ? `<div class="card list">${recent.map(l => logRow(l)).join("")}</div>`
        : `<div class="card empty">游完点“完成训练”，记录会出现在这里。</div>`}
      <div class="sec"><b>我的收藏</b>${S.favs.length ? `<button data-act="goFavs">全部 ›</button>` : ""}</div>
      ${favs.length ? `<div class="favs">${favs.map(f => `<button class="fav" data-act="loadFav" data-id="${f.id}"><b>${esc(f.name)}</b><small>${f.mins} 分钟 · ${f.dist.toLocaleString()} ${U}</small>${cfgBar(f.cfg)}</button>`).join("")}</div>`
        : `<div class="card empty">在课表页点“收藏”，喜欢的课表会放在这里。</div>`}`;
  },

  plans() {
    const seg = S.seg.plans || "mine";
    let body = "";
    if (seg === "mine") {
      ensureToday();
      const p = compute();
      body += planCard(p, S.o, { label: S.planCustom ? "今天的课表 · 自己安排的" : "今天的推荐", why: S.planCustom ? "" : S.planWhy, attrs: `data-go="plan"`,
        foot: `<div class="pc-foot"><button class="txt" data-act="reroll">换一份</button><button class="txt" data-go="plan">打开课表 ›</button></div>` });
      body += `<button class="btn soft wide" data-act="custom">自己安排</button>`;
      const wk = planWeek();
      if (wk.length) body += `<div class="sec"><b>接下来 7 天</b><span>每周 ${P().weekly} 次</span></div><div class="card list">${wk.map(d => {
        const dt = new Date(d.date + "T00:00:00"), lab = d.date === todayStr() ? "今天" : `${dt.getMonth() + 1}/${dt.getDate()}`;
        return `<div class="li wk"><span class="badge${d.rest ? " rest" : ""}" style="color:${d.rest ? "var(--muted)" : FCOLOR[d.focus]}">${lab}</span><span class="g"><b>${d.rest ? "休息" : FOCUS[d.focus] + "课 · " + d.minutes + " 分钟"}</b><small>${esc(d.why)} · 星期${"日一二三四五六"[dt.getDay()]}</small></span></div>`; }).join("")}</div>
        <p class="hint">这是暂定安排，每次训练前会按最新的记录重新算。</p>`;
    } else if (seg === "tpl") {
      body += FOCI.map(f => `<div class="sec"><b>${FOCUS[f]}</b></div><div class="card list">${COMPOSITES.filter(c => c.focus === f).map(c =>
        `<button class="li" data-act="tpl" data-key="${c.key}"><span class="dotc" style="background:${FCOLOR[f]}"></span><span class="g"><b>${esc(c.title)}${c.stroke ? ` · ${c.stroke}` : ""}</b><small>${esc(c.tip)}</small></span><span class="chev">›</span></button>`).join("")}</div>`).join("")
        + `<p class="hint">模板的主项来自 USMS 和 Swim England 公开课表，热身、技术练习和放松会按你的档案自动配好。</p>`;
    } else {
      body += S.favs.length ? S.favs.map(f => {
        const p = withCfg(f.cfg, () => compute()), o = f.cfg.o;
        const foot = S.renaming === f.id
          ? `<div class="pc-foot"><input class="input" id="rn" maxlength="30" value="${esc(f.name)}"><button class="txt" data-act="renameOk" data-id="${f.id}">保存</button></div>`
          : `<div class="pc-foot"><button class="txt" data-act="rename" data-id="${f.id}">改名</button><button class="txt red" data-act="delFav" data-id="${f.id}">${S.confirm === f.id ? "再点一次确认" : "删除"}</button></div>`;
        return planCard(p, o, { label: "收藏", title: esc(f.name), attrs: `data-act="loadFav" data-id="${f.id}"`, foot });
      }).join("") : `<div class="card empty">还没有收藏。在课表页点“收藏”，喜欢的课表就会存在这里。</div>`;
    }
    return topBar("计划") + segs("plans", [["mine", "我的课表"], ["tpl", "课表模板"], ["fav", "收藏"]]) + body;
  },

  plan() {
    if (!S.rows.length) { S.view = "plans"; return V.plans(); }
    const p = compute(), U = unitOf(), saved = isSaved();
    const rows = laneRows(p, true);
    return topBar("今日课表", S.planBack || "home", `<button class="txt" data-act="custom">修改</button>`) + `
      <div class="sum"><div><b class="num">${p.dist.toLocaleString()}</b><small>${U}</small></div><div><b class="num">${p.mins}</b><small>分钟</small></div><div><b class="num">${p.dist / S.o.pool}</b><small>趟</small></div></div>
      <p class="hint plan-hint">${FOCUS[S.o.focus]}课${S.planWhy ? " · " + esc(S.planWhy) : ""}。按顺序从 1 游到 ${p.rows.length}，点任意一项看怎么练，往左滑可以换掉或删除。</p>
      <div class="card list lane">${rows}<button class="add" data-act="add">＋ 加一组</button></div>
      <button class="txt center" data-act="copy">复制课表文字</button>
      <div class="bar"><button class="btn soft" data-act="reroll">换一份</button><button class="btn soft" data-act="fav">${saved ? "已收藏" : "收藏"}</button><button class="btn" data-go="done">完成训练</button></div>`;
  },

  detail() {
    const p = compute(), x = p.rows.find(r => r.r.id === S.cur);
    if (!x) { S.view = "plan"; return V.plan(); }
    const s = x.sets[0], comp = x.opt.composite, P0 = S.o.pool, U = unitOf();
    const st = strokesOf(S.o), isMain = x.r.type === "main" || x.r.type === "extra";
    const opts = x.opts.map(op => {
      const t = tools(S.o), total = op.sets.reduce((a, e) => a + finishSet({ ...e }, t).total, 0);
      return `<button class="li${op.key === x.r.key ? " sel" : ""}" data-act="pick" data-key="${esc(op.key)}"><span class="g"><b>${esc(op.title)}${op.composite ? ' <i class="tag">组合</i>' : ""}</b><small>${esc(op.sub || op.sets[0].stroke)}</small></span><span class="num muted">${op.outer > 1 ? op.outer + " 轮 · " : ""}${total.toLocaleString()} ${U}</span></button>`;
    }).join("");
    const atMin = comp ? (x.opt.roundsAdj ? s.outer <= 1 : x.sets.every(e => e.n <= 1)) : s.ladder ? s.rounds <= 1 : (s.adjust === "d" || s.n === 1) ? s.d <= P0 : s.n <= 1;
    const stepLabel = comp ? (x.opt.roundsAdj ? `${s.outer} 轮` : `每段组数 ${x.r.adj >= 0 ? "+" : ""}${x.r.adj}`) : stepText(s);
    return topBar(x.def.name, "plan") + detailTop(x) + `
      <div class="sec"><b>调整</b></div>
      <div class="stepper"><button data-act="dec" ${atMin ? "disabled" : ""} aria-label="减少">−</button><span>${stepLabel}</span><button data-act="inc" aria-label="增加">＋</button></div>
      ${isMain && st.length > 1 ? `<div class="sec"><b>主项泳姿</b></div><div class="chips">${st.map(v => `<button class="chip${v === S.ms ? " on" : ""}" data-act="ms" data-v="${v}">${v}</button>`).join("")}</div>` : ""}
      <div class="sec"><b>换一个练法</b><span>${x.opts.length} 种</span></div>
      <div class="card list">${opts}</div>
      <button class="btn danger" data-act="del">${S.confirm === x.r.id ? "再点一次确认删除" : "删除这一项"}</button>`;
  },

  setup() {
    const d = S.draft;
    const seg = (k, items) => `<div class="choose">${items.map(([v, l]) => `<button class="${d[k] == v ? "on" : ""}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join("")}</div>`;
    return topBar("安排训练", S.setupBack || "plans") + `
      <div class="sec first"><b>今天游多久</b></div>${seg("time", [[30, "30 分"], [45, "45 分"], [60, "60 分"], [90, "90 分"]])}
      <div class="sec"><b>今天练什么</b></div>${seg("focus", [["endurance", "耐力"], ["speed", "速度"], ["technique", "技术"]])}
      <div class="sec"><b>今天游哪些泳姿</b></div><div class="chips">${STROKES.map(s => `<button class="chip${d.strokes.includes(s) ? " on" : ""}" data-act="stroke" data-v="${s}">${s}</button>`).join("")}</div>
      <div class="sec"><b>器材</b><span>不选就不安排需要器材的练法</span></div><div class="chips">${EQUIP.map(e => `<button class="chip${d.equip.includes(e) ? " on" : ""}" data-act="equip" data-v="${e}">${e}</button>`).join("")}</div>
      <button class="go" data-act="gen">生成课表</button>`;
  },

  done() {
    const p = compute(), r = S.rpe, pct = S.pct == null ? 100 : S.pct;
    const lab = r == null ? "选一个分数" : r <= 3 ? "很轻松" : r <= 5 ? "适中" : r <= 7 ? "有点累" : r <= 8 ? "很累" : "累到极限";
    const got = Math.round(p.dist * pct / 100 / S.o.pool) * S.o.pool;
    return topBar("完成训练", "plan") + `
      <div class="dhero"><small>辛苦了</small><h2>今天游得怎么样?</h2></div>
      <div class="sec first"><b>完成了多少</b><span id="pctLab" class="num">${pct}% · 约 ${got.toLocaleString()} ${unitOf()}</span></div>
      <input class="range" type="range" id="dPct" min="0" max="100" step="5" value="${pct}" data-plan="${p.dist}" data-pool="${S.o.pool}" style="--v:${pct}%" aria-label="完成度">
      <div class="rpel"><span>0%</span><span>50%</span><span>全部完成</span></div>
      <div class="sec"><b>整体有多累</b><span>${lab}</span></div>
      <div class="rpe">${Array.from({ length: 11 }, (_, i) => `<button class="${r === i ? "on" : ""}" data-act="rpe" data-v="${i}">${i}</button>`).join("")}</div>
      <div class="rpel"><span>0 完全不累</span><span>10 累到极限</span></div>
      <div class="sec"><b>日期</b></div><input class="input" type="date" id="dDate" value="${S.dDate || todayStr()}">
      <div class="sec"><b>备注</b><span>可以不填</span></div>
      <textarea class="input" id="dNote" maxlength="200" placeholder="比如：最后两组没游完，肩膀有点酸">${esc(S.dNote || "")}</textarea>
      <button class="go" data-act="log">记下来</button>
      <p class="hint center">完成度和累度都会影响下一次的推荐：没游完或太累就少排一点。</p>`;
  },

  hist() {
    const seg = S.seg.hist || "log";
    return topBar("记录") + segs("hist", [["log", "训练记录"], ["stat", "训练统计"], ["trend", "进步趋势"]]) + (seg === "log" ? histLog() : seg === "stat" ? histStat() : histTrend());
  },

  day() {
    const list = S.logs.filter(l => l.date === S.day), [, m, d] = S.day.split("-").map(Number);
    return topBar(`${m} 月 ${d} 日`, "hist") + (list.length ? list.map(l => `<div class="card info">
        <div class="flexrow"><b>${FOCUS[focusOf(l)]}课 · ${l.dist.toLocaleString()} ${unitOf()}</b><span class="muted">${l.rpe != null ? `累 ${l.rpe}/10` : ""}</span></div>
        ${l.note ? `<p>${esc(l.note)}</p>` : ""}
        <ul class="ul">${l.lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        <div class="two"><button class="btn soft" data-act="again" data-id="${l.id}">再练一次</button><button class="btn soft red" data-act="delLog" data-id="${l.id}">${S.confirm === l.id ? "确认删除" : "删除记录"}</button></div></div>`).join("")
      : `<div class="card empty">这一天没有训练记录。</div>`);
  },

  me() {
    const pr = P(), U = unitOf();
    const paces = (pr.strokes.length ? pr.strokes : ["自由泳"]).map(s => `${s} ${fmtPace(strokePace({ unit: U }, s))}${pr.pace[s] ? "" : "(估计)"}`).join(" · ");
    const row = (k, label, val) => `<button class="li" data-act="editQ" data-q="${k}"><span class="g"><small>${label}</small><b>${val}</b></span><span class="chev">›</span></button>`;
    return topBar("我的") + (pr.onboarded ? "" : `<button class="card invite" data-act="redoQuiz"><b>填一下你的游泳档案</b><small>6 个问题，大概 30 秒。填完以后，推荐的课表会更适合你。</small><span class="go small">开始填写</span></button>`) + `
      <div class="sec ${pr.onboarded ? "first" : ""}"><b>我的游泳档案</b><span>${pr.onboarded ? "推荐会按这些来排" : "现在用的是默认值"}</span></div>
      <div class="card list">
        ${row("goal", "目标", GOALS[pr.goal])}
        ${row("level", "现在能连续游", LEVELS[pr.level][0] + " " + U)}
        ${row("strokes", "会的泳姿", pr.strokes.join("、") || "还没选")}
        ${row("speed", "每 100 " + U + " 大概多久", paces)}
        ${row("weekly", "每周", `${pr.weekly} 次 · 每次 ${pr.minutes} 分钟`)}
      </div>
      <div class="sec"><b>训练偏好</b></div>
      <div class="card list">
        <div class="li col"><span class="g"><small>常带的器材</small></span><div class="chips">${EQUIP.map(e => `<button class="chip${pr.equip.includes(e) ? " on" : ""}" data-act="prefEquip" data-v="${e}">${e}</button>`).join("")}</div></div>
      </div>
      <div class="sec"><b>单位设置</b></div>
      <div class="card list">${row("pool", "常用泳池", POOLS[pr.pool][0] + " " + POOLS[pr.pool][1])}</div>
      <div class="sec"><b>应用设置</b></div>
      <div class="card list">
        <button class="li" data-act="redoQuiz"><span class="g"><b>${pr.onboarded ? "重新做一遍问卷" : "做问卷"}</b></span><span class="chev">›</span></button>
        <button class="li" data-act="wipe"><span class="g"><b class="red">${S.confirm === "wipe" ? "再点一次，清除所有数据" : "清除所有数据"}</b><small>训练记录、收藏和档案都会删掉</small></span></button>
        <div class="li"><span class="g"><small>版本</small><b>泳池课表 ${VERSION}</b></span></div>
      </div>
      ${!TEST_TOOLS ? "" : `<div class="sec"><b>测试模式</b><span>模拟一周，看推荐怎么变</span></div>
      <div class="card list">
        <button class="li toggle" data-act="testToggle"><span class="g"><b>测试模式</b><small>${S.testMode ? `已打开，App 里的“今天”是 ${nowDate().getMonth() + 1} 月 ${nowDate().getDate()} 日` : "打开后可以一天一天往后模拟"}</small></span><span class="sw${S.testMode ? " on" : ""}"><i></i></span></button>
        ${S.testMode ? `<button class="li" data-act="nextDay"><span class="g"><b>下一天</b><small>App 当成过了一天，推荐和打卡都会变</small></span><span class="chev">›</span></button>
        <button class="li" data-act="realDay"><span class="g"><b>回到真实日期</b><small>测试记录会保留，直到你清除</small></span><span class="chev">›</span></button>` : ""}
        <button class="li" data-act="clearTest"><span class="g"><b class="red">${S.confirm === "clearTest" ? "再点一次确认" : "清除测试记录"}</b><small>只删测试模式下记的 ${S.logs.filter(l => l.test).length} 条，真实记录不动</small></span></button>
      </div>`}
      <p class="hint center">所有数据只存在这台手机里。</p>`;
  },

  past() {
    const l = S.logs.find(x => x.id === S.pastId);
    if (!l) { S.view = "hist"; return V.hist(); }
    const [, m, d] = l.date.split("-").map(Number), U = unitOf();
    return withCfg(l.cfg, () => {
      const p = compute();
      return topBar(`${m} 月 ${d} 日`, "hist") + `
        <div class="sum"><div><b class="num">${l.dist.toLocaleString()}</b><small>${U}</small></div><div><b class="num">${pctOf(l)}%</b><small>完成</small></div><div><b class="num">${l.rpe != null ? l.rpe : "—"}</b><small>累度</small></div></div>
        <p class="hint plan-hint">${FOCUS[focusOf(l)]}课 · 计划 ${p.dist.toLocaleString()} ${U}、约 ${l.mins || p.mins} 分钟${l.note ? "。备注：" + esc(l.note) : ""}。点任意一项看当时怎么练。</p>
        <div class="card list lane">${laneRows(p, false)}<div class="add end"></div></div>
        <div class="two"><button class="btn soft red" data-act="delLog" data-id="${l.id}">${S.confirm === l.id ? "再点一次确认" : "删除记录"}</button><button class="btn" data-act="again" data-id="${l.id}">再练一次</button></div>`;
    });
  },
  pastDetail() {
    const l = S.logs.find(x => x.id === S.pastId);
    if (!l) { S.view = "hist"; return V.hist(); }
    return withCfg(l.cfg, () => {
      const p = compute(), x = p.rows[S.pastIdx] || p.rows[0];
      return topBar(x.def.name, "past") + detailTop(x) + `<button class="go" data-act="again" data-id="${l.id}">把这份课表再练一次</button>`;
    });
  },

  quiz() { return quizView(); }
};

function testBanner() {
  if (!TEST_TOOLS || !S.testMode) return "";
  const d = nowDate();
  return `<div class="testbar"><span>测试模式：今天是 ${d.getMonth() + 1} 月 ${d.getDate()} 日</span><button data-act="nextDay">下一天 ›</button></div>`;
}
function logRow(l) {
  const [, m, d] = l.date.split("-").map(Number), f = focusOf(l);
  const feel = l.rpe == null ? "" : ` · ${l.rpe <= 3 ? "很轻松" : l.rpe <= 5 ? "刚好" : l.rpe <= 7 ? "有点累" : "很累"}`;
